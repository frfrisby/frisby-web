# ---------------------------------------------------------------------------
# JUL configuration for virtual-threads-smoke-tests module tests
#
# Framework logger namespaces below are capped at WARNING so that verbose
# Jetty/Jersey/HK2 startup chatter (e.g. the expected
# ClassNotFoundException: org.osgi.framework.BundleReference stack trace
# Jersey logs at FINER while probing for an OSGi environment) does not
# clutter the console output of these smoke tests.
# ---------------------------------------------------------------------------
handlers = java.util.logging.ConsoleHandler
.level = ALL
java.util.logging.ConsoleHandler.level     = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format   = %1$tT.%1$tL [%4$-7s] %3$s -- %5$s%6$s%n

# Suppress verbose framework logging - only WARNING and above from these namespaces
org.eclipse.jetty.level    = WARNING
org.glassfish.jersey.level = WARNING
org.glassfish.hk2.level    = WARNING
org.jvnet.hk2.level        = WARNING

# Jersey logs a WARNING at startup when jakarta.activation.DataSource is absent
# (the provider is optional and unused here - suppress to avoid noise).
org.glassfish.jersey.message.internal.MessagingBinders.level = SEVERE

